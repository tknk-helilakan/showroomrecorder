# Third-party OpenAI-compatible endpoint example.
# Edit rooms before running. Only set enabled: true for rooms you really want to monitor.

service:
  timezone: "Asia/Shanghai"
  poll_interval_seconds: 30
  status_parallelism: 2
  processing_parallelism: 1
  record_retry_cooldown_seconds: 180
  data_dir: "data/third-party"
  log_level: "INFO"

rooms:
  # Replace this with your own SHOWROOM rooms and set enabled: true.
  - name: "示例房间"
    room_id: 123456
    url: "https://www.showroom-live.com/r/example"
    enabled: false

naming:
  filename_template: "{streamer}_{started_at:%Y%m%d_%H%M%S}_{title_slug}"
  title_template: "【{streamer}】SHOWROOM直播录像 {started_at:%Y-%m-%d %H:%M}"
  part_title_template: "{started_at:%Y%m%d} showroom 直播"
  desc_template: |
    自动录制的 SHOWROOM 直播录像。
    主播：{streamer}
    直播间：{room_url}
    录制时间：{started_at:%Y-%m-%d %H:%M:%S}
  dynamic_template: "{streamer} SHOWROOM直播录像"

record:
  strategy: "yt_dlp"
  yt_dlp_bin: "yt-dlp"
  extra_args: []
  cookies_file: ""
  min_file_size_mb: 5
  min_duration_seconds: 10
  ffmpeg_fallback_to_ytdlp: true
  reconnect_delay_seconds: 5
  live_end_confirmations: 4
  live_end_check_interval_seconds: 20
  live_end_grace_seconds: 180
  hls_concurrent_fragments: 2
  proxy:
    enabled: false
    mode: "auto" # auto | proxy_only | off
    include_system: true
    urls:
      - "http://127.0.0.1:7897"
    file: ""
    source_url: ""
    cache_file: "data/proxy/recording-proxies.cache"
    probe_url: "https://www.showroom-live.com/api/live/onlives"
    probe_timeout_seconds: 5
    source_timeout_seconds: 15
    refresh_seconds: 300

transcode:
  enabled: true
  ffmpeg_bin: "ffmpeg"
  ffprobe_bin: "ffprobe"
  width: 1920
  height: 1080
  # Empty preserves source timestamps and avoids frame-rate-induced A/V drift.
  fps:
  scale_mode: "fit"
  video_codec: "libx264"
  preset: "medium"
  crf: 20
  audio_codec: "aac"
  audio_bitrate: "192k"
  extra_args: []
  validate_av_sync: true
  max_av_desync_seconds: 3

asr:
  enabled: true
  provider: "openai_compatible"
  # The provider must support /audio/transcriptions. If it only supports text chat,
  # use local faster_whisper for ASR instead.
  model: "provider-asr-model-name"
  base_url: "https://your-provider.example.com/v1"
  api_key_env: "THIRD_PARTY_API_KEY"
  organization_env: ""
  project_env: ""
  trust_env: false
  timeout_seconds: 300
  retries: 3
  language: "ja"
  chunk_seconds: 180
  max_file_size_mb: 24
  audio_format: "mp3"
  audio_bitrate: "64k"
  response_format: "json"
  chunking_strategy: ""
  prompt: ""

translation:
  enabled: true
  # Most third-party compatible APIs support /chat/completions, not Responses API.
  provider: "openai_compatible"
  batch_size: 20
  retries: 3
  openai_compatible:
    base_url: "https://your-provider.example.com/v1"
    api_key_env: "THIRD_PARTY_API_KEY"
    trust_env: false
    model: "provider-text-model-name"
    temperature: 0.1
    timeout_seconds: 180
    json_mode: false
  openai_responses:
    base_url: "https://your-provider.example.com/v1"
    api_key_env: "THIRD_PARTY_API_KEY"
    organization_env: ""
    project_env: ""
    trust_env: false
    model: "provider-responses-model-name"
    reasoning_effort: "high"
    max_output_tokens: 8192
    timeout_seconds: 180

subtitles:
  max_line_chars: 24
  bilingual: false

danmaku:
  enabled: false
  burn_in: true
  poll_seconds: 2
  request_timeout_seconds: 10
  display_seconds: 14
  max_entries: 20000
  max_text_chars: 80
  max_user_name_chars: 16
  lane_count: 12
  font_name: "Microsoft YaHei"
  font_size: 32
  font_opacity: 0.6
  top_margin: 24
  bottom_margin: 140
  include_user_name: true
  include_system_messages: false

upload:
  # Set to true only after biliup login and upload metadata are ready.
  enabled: false
  uploader: "biliup"
  subtitle_mode: "hard_subbed"
  cleanup_after_success: false
  keep_latest_upload_per_room: false
  biliup:
    mode: "upload" # upload | append | monthly
    append_vid: ""
    append_vids: {}
    monthly_state_file: "data/biliup-monthly.json"
    monthly_key_template: "{streamer}:{started_at:%Y%m}"
    trust_env: false
    bin: "biliup"
    user_cookie: "data/biliup-cookies.json"
    collection:
      enabled: false
      title: "showroom直播"
      season_id: null
      section_id: null
      section_title: "正片"
      page_wait_seconds: 900
      page_poll_seconds: 30
      request_timeout_seconds: 30
      errors_fatal: false
    line: "kodo"
    limit: 3
    tid: 21
    copyright: 2
    source_template: "{room_url}"
    tags:
      - "SHOWROOM"
      - "直播录像"
    cover: ""
    desc_format_id: 0
    open_subtitle: true
    subtitle_language: "zh"
    upload_subtitle_draft: false
    subtitle_page_wait_seconds: 900
    subtitle_page_poll_seconds: 30
    subtitle_save_attempts: 3
    subtitle_save_retry_seconds: 5
    subtitle_errors_fatal: true
    extra_args: []

baidu_netdisk:
  enabled: false
  required_for_cleanup: false
  app_key: ""
  secret_key: ""
  token_file: "data/baidu-netdisk-token.json"
  state_dir: "data/baidu-netdisk/uploads"
  remote_root: ""
  remote_path_template: "{streamer_slug}/{streamer_slug}_{started_at:%Y%m%d_%H%M%S}_recording-merged.mkv"
  conflict_policy: "overwrite"
  chunk_size_mb: 4
  retries: 5
  retry_seconds: 2
  request_timeout_seconds: 60
  upload_timeout_seconds: 300
  trust_env: false
