service:
  timezone: "Asia/Shanghai"
  poll_interval_seconds: 30
  status_parallelism: 2
  processing_parallelism: 1
  record_retry_cooldown_seconds: 180
  data_dir: "data/local-model"
  log_level: "INFO"

rooms:
  # Replace this with your own SHOWROOM rooms and set enabled: true.
  - name: "示例房间"
    room_id: 123456
    url: "https://www.showroom-live.com/r/example"
    enabled: false

naming:
  filename_template: "{streamer}_{started_at:%Y%m%d_%H%M%S}_{title_slug}"

record:
  strategy: "ffmpeg"
  min_file_size_mb: 0.1
  min_duration_seconds: 10
  ffmpeg_fallback_to_ytdlp: true
  reconnect_delay_seconds: 5
  live_end_confirmations: 4
  live_end_check_interval_seconds: 20
  hls_concurrent_fragments: 2
  proxy:
    enabled: false
    mode: "auto" # auto | proxy_only | off
    include_system: true
    urls:
      - "http://127.0.0.1:7897"
    file: ""
    source_url: ""
    cache_file: "data/proxy/recording-proxies.cache"
    probe_url: "https://www.showroom-live.com/api/live/onlives"
    probe_timeout_seconds: 5
    source_timeout_seconds: 15
    refresh_seconds: 300
  # Optional test-only limit. Leave empty/null for normal full-live recording.
  max_seconds:

transcode:
  enabled: true
  ffmpeg_bin: "ffmpeg"
  ffprobe_bin: "ffprobe"
  width: 1280
  height: 720
  # Empty preserves source timestamps and avoids frame-rate-induced A/V drift.
  fps:
  scale_mode: "fit"
  video_codec: "libx264"
  preset: "veryfast"
  crf: 23
  audio_codec: "aac"
  audio_bitrate: "128k"
  extra_args: []
  validate_av_sync: true
  max_av_desync_seconds: 3

asr:
  enabled: true
  provider: "faster_whisper"
  # 可以填模型名，也可以填你下载好的本地 CTranslate2/faster-whisper 模型目录。
  # 例如："models/asr/faster-whisper-large-v3"
  model: "models/asr/faster-whisper-large-v3"
  device: "cpu"        # cpu | cuda | auto
  compute_type: "int8" # CPU: int8. NVIDIA GPU: float16.
  normalize_audio: true
  language: "ja"
  task: "transcribe"
  beam_size: 5
  vad_filter: true
  vad_parameters: {}
  # 直播和歌曲建议关闭，避免上一段识别错误继续影响下一段。
  condition_on_previous_text: false
  # 固定为 0，禁用逐步升温重试，输出更稳定。
  temperature: 0.0
  # 数值越高越不容易判定为静音；直播场景建议先保留默认值 0.6。
  no_speech_threshold: 0.6
  # 越接近 0 越严格，-1.0 比 -1.2 更能过滤低置信度内容。
  log_prob_threshold: -1.0
  compression_ratio_threshold: 2.4
  # 启用字级时间戳后，静音幻觉阈值才会生效。
  word_timestamps: true
  hallucination_silence_threshold: 2.0
  # 可填写人名、组合名等日语提示；留空表示不使用提示词。
  initial_prompt: ""
  log_progress: false

translation:
  enabled: true
  provider: "transformers_seq2seq"
  batch_size: 8
  retries: 1
  transformers:
    # 指向你下载好的 Hugging Face seq2seq 翻译模型目录。
    # NLLB 示例语言代码：日语 jpn_Jpan -> 简中 zho_Hans
    model_path: "models/translation/nllb-200-distilled-600M"
    local_files_only: true
    source_lang: "jpn_Jpan"
    target_lang: "zho_Hans"
    device: "cpu"       # cpu | cuda | auto
    torch_dtype: "float32"
    batch_size: 1
    max_input_tokens: 256
    max_new_tokens: 160
    num_beams: 4

subtitles:
  max_line_chars: 24
  bilingual: false
  # Optional: create an additional MP4 with translated subtitles burned in.
  burn_in: false
