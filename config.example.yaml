service:
  timezone: "Asia/Shanghai"
  poll_interval_seconds: 30
  status_parallelism: 2
  processing_parallelism: 1
  record_retry_cooldown_seconds: 180
  data_dir: "data"
  log_level: "INFO"

rooms:
  # Replace this with your own SHOWROOM rooms and set enabled: true.
  - name: "示例房间"
    room_id: 123456
    url: "https://www.showroom-live.com/r/example"
    poll_interval_seconds: 30
    enabled: false

naming:
  filename_template: "{streamer}_{started_at:%Y%m%d_%H%M%S}_{title_slug}"

record:
  strategy: "streamlink"
  yt_dlp_bin: "yt-dlp"
  streamlink_bin: "streamlink"
  extra_args: []
  streamlink_extra_args: []
  cookies_file: ""
  min_file_size_mb: 5
  min_duration_seconds: 10
  ffmpeg_fallback_to_ytdlp: true
  streamlink_fallback_to_ffmpeg: true
  # Keep reconnects in one logical live job; finalize after 4 offline checks over 60 seconds.
  reconnect_delay_seconds: 5
  live_end_confirmations: 4
  live_end_check_interval_seconds: 20
  hls_concurrent_fragments: 2
  hls_fragment_retries: 5
  capture_realtime_ratio_warning: 0.95
  proxy:
    # auto: explicit system proxy, then normal system/TUN routing, then project proxies.
    enabled: false
    mode: "auto" # auto | proxy_only | off
    include_system: true
    urls:
      - "http://127.0.0.1:7897"
    # YAML/JSON/text file containing HTTP proxy endpoint URLs.
    file: ""
    # URL returning the same endpoint-list formats; the last valid response is cached.
    source_url: ""
    cache_file: "data/proxy/recording-proxies.cache"
    probe_url: "https://www.showroom-live.com/api/live/onlives"
    probe_timeout_seconds: 5
    source_timeout_seconds: 15
    refresh_seconds: 300
  # Optional test-only limit. Leave empty/null for normal full-live recording.
  max_seconds:

transcode:
  enabled: true
  ffmpeg_bin: "ffmpeg"
  ffprobe_bin: "ffprobe"
  width: 1920
  height: 1080
  # Empty preserves the source frame cadence.
  fps:
  scale_mode: "fit"
  video_codec: "libx264"
  preset: "medium"
  crf: 20
  audio_codec: "aac"
  audio_bitrate: "192k"
  extra_args: []
  validate_av_sync: true
  max_av_desync_seconds: 3

asr:
  enabled: true
  provider: "openai" # openai | openai_compatible
  model: "gpt-4o-transcribe-diarize"
  base_url: "https://api.openai.com/v1"
  api_key_env: "OPENAI_API_KEY"
  organization_env: "OPENAI_ORG_ID"
  project_env: "OPENAI_PROJECT_ID"
  trust_env: false
  timeout_seconds: 300
  retries: 3
  language: "ja"
  chunk_seconds: 180
  max_file_size_mb: 24
  audio_format: "mp3"
  audio_bitrate: "64k"
  response_format: "diarized_json"
  chunking_strategy: "auto"
  prompt: ""
  normalize_audio: true

translation:
  enabled: true
  provider: "openai_responses"
  batch_size: 20
  retries: 3
  openai_responses:
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    organization_env: "OPENAI_ORG_ID"
    project_env: "OPENAI_PROJECT_ID"
    trust_env: false
    model: "gpt-5.5"
    reasoning_effort: "high"
    max_output_tokens: 8192
    timeout_seconds: 180
  openai_compatible:
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    trust_env: false
    model: "gpt-4o-mini"
    temperature: 0.1
    timeout_seconds: 120
    json_mode: false
  transformers:
    model_path: "models/translation/nllb-200-distilled-600M"
    local_files_only: true
    source_lang: "jpn_Jpan"
    target_lang: "zho_Hans"
    device: "auto"
    torch_dtype: "float16"
    batch_size: 8
    max_input_tokens: 256
    max_new_tokens: 160
    num_beams: 4
  deepl:
    api_key_env: "DEEPL_API_KEY"
    endpoint: "https://api-free.deepl.com/v2/translate"
    target_lang: "ZH-HANS"
  argos:
    from_lang: "ja"
    to_lang: "zh"
  external:
    command: []

subtitles:
  max_line_chars: 24
  bilingual: false
  # Optional: create an additional MP4 with translated subtitles burned in.
  burn_in: false
