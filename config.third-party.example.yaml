# Third-party OpenAI-compatible endpoint example.
# Edit rooms before running. Only set enabled: true for rooms you really want to monitor.

service:
  timezone: "Asia/Shanghai"
  poll_interval_seconds: 30
  status_parallelism: 2
  processing_parallelism: 1
  record_retry_cooldown_seconds: 180
  data_dir: "data/third-party"
  log_level: "INFO"

rooms:
  # Replace this with your own SHOWROOM rooms and set enabled: true.
  - name: "示例房间"
    room_id: 123456
    url: "https://www.showroom-live.com/r/example"
    enabled: false

naming:
  filename_template: "{streamer}_{started_at:%Y%m%d_%H%M%S}_{title_slug}"

record:
  strategy: "yt_dlp"
  yt_dlp_bin: "yt-dlp"
  extra_args: []
  cookies_file: ""
  min_file_size_mb: 5
  min_duration_seconds: 10
  ffmpeg_fallback_to_ytdlp: true
  reconnect_delay_seconds: 5
  live_end_confirmations: 4
  live_end_check_interval_seconds: 20
  hls_concurrent_fragments: 2
  proxy:
    enabled: false
    mode: "auto" # auto | proxy_only | off
    include_system: true
    urls:
      - "http://127.0.0.1:7897"
    file: ""
    source_url: ""
    cache_file: "data/proxy/recording-proxies.cache"
    probe_url: "https://www.showroom-live.com/api/live/onlives"
    probe_timeout_seconds: 5
    source_timeout_seconds: 15
    refresh_seconds: 300

transcode:
  enabled: true
  ffmpeg_bin: "ffmpeg"
  ffprobe_bin: "ffprobe"
  width: 1920
  height: 1080
  # Empty preserves source timestamps and avoids frame-rate-induced A/V drift.
  fps:
  scale_mode: "fit"
  video_codec: "libx264"
  preset: "medium"
  crf: 20
  audio_codec: "aac"
  audio_bitrate: "192k"
  extra_args: []
  validate_av_sync: true
  max_av_desync_seconds: 3

asr:
  enabled: true
  provider: "openai_compatible"
  # The provider must support /audio/transcriptions. If it only supports text chat,
  # use local faster_whisper for ASR instead.
  model: "provider-asr-model-name"
  base_url: "https://your-provider.example.com/v1"
  api_key_env: "THIRD_PARTY_API_KEY"
  organization_env: ""
  project_env: ""
  trust_env: false
  timeout_seconds: 300
  retries: 3
  language: "ja"
  chunk_seconds: 180
  max_file_size_mb: 24
  audio_format: "mp3"
  audio_bitrate: "64k"
  response_format: "json"
  chunking_strategy: ""
  prompt: ""

translation:
  enabled: true
  # Most third-party compatible APIs support /chat/completions, not Responses API.
  provider: "openai_compatible"
  batch_size: 20
  retries: 3
  openai_compatible:
    base_url: "https://your-provider.example.com/v1"
    api_key_env: "THIRD_PARTY_API_KEY"
    trust_env: false
    model: "provider-text-model-name"
    temperature: 0.1
    timeout_seconds: 180
    json_mode: false
  openai_responses:
    base_url: "https://your-provider.example.com/v1"
    api_key_env: "THIRD_PARTY_API_KEY"
    organization_env: ""
    project_env: ""
    trust_env: false
    model: "provider-responses-model-name"
    reasoning_effort: "high"
    max_output_tokens: 8192
    timeout_seconds: 180

subtitles:
  max_line_chars: 24
  bilingual: false
  # Optional: create an additional MP4 with translated subtitles burned in.
  burn_in: false
